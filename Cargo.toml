[package]
name = "uu-i2p"
version = "0.1.0"
edition = "2024"

[dependencies]
#anyhow = "1.0.104"
rand = "0.8"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }

# RustCrypto: чистый Rust, без системного OpenSSL
chacha20 = "0.10"
chacha20poly1305 = "0.11"
hkdf = "0.13"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
zeroize = "1"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
# RustCrypto: AES-256-CBC для NTCP2 handshake и tunnels
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }

num-bigint = "0.4"
num-traits = "0.2"


httparse = "1"
http = "1"
url = "2"
percent-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
time = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.clippy]
all="deny"
pedantic="deny"
nursery="deny"
perf="deny"
